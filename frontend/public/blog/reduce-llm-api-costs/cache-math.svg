<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 366" width="600" height="366" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">A 10,000-token prompt, sent 10 times</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Billed input in token-equivalents. One cache write at 1.25x, then nine</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">cache hits.</text><text x="24" y="117" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">No caching</text><line x1="24" y1="124" x2="24" y2="148" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 125H492.2Q496.2 125 496.2 129V143Q496.2 147 492.2 147H24Z" style="fill:var(--bf-s3,#c2558f)"><title>No caching: 100,000</title></path><text x="504.2" y="141" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">100,000</text><text x="24" y="175" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Hits at 0.1x (most models)</text><text x="257.6" y="175" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">78% less</text><line x1="24" y1="182" x2="24" y2="206" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 183H121.5Q125.5 183 125.5 187V201Q125.5 205 121.5 205H24Z" style="fill:var(--bf-s1,#b45309)"><title>Hits at 0.1x (most models): 21,500</title></path><text x="133.5" y="199" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">21,500</text><text x="24" y="233" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Hits at 0.05x (Sonnet/Opus 5.5)</text><text x="300.6" y="233" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">83% less</text><line x1="24" y1="240" x2="24" y2="264" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 241H100.3Q104.3 241 104.3 245V259Q104.3 263 100.3 263H24Z" style="fill:var(--bf-s1,#b45309)"><title>Hits at 0.05x (Sonnet/Opus 5.5): 17,000</title></path><text x="112.3" y="257" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">17,000</text><text x="24" y="300" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">12,500 for the first write plus 9 hits. The 5-minute cache refreshes on</text><text x="24" y="319" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">each hit. Rates checked 20 October 2026.</text><line x1="24" y1="330" x2="576" y2="330" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="339" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="340.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="341.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="342.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="344" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="345.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="346.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="339" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="340.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="341.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="342.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="344" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="345.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="346.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="349" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="348" text-anchor="end" style="fill:var(--faint,#64748b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser · llmiser.devbehindyou.com</text></svg>
