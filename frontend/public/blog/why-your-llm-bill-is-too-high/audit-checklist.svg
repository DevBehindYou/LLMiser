<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 363" width="600" height="363" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">The one-hour cost audit</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Run it on a day of real traffic, not a demo.</text><rect x="24" y="81" width="552" height="240" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><circle cx="40" cy="99" r="4" style="fill:var(--border-3,#cbd5e1)"/><circle cx="54" cy="99" r="4" style="fill:var(--border-3,#cbd5e1)"/><circle cx="68" cy="99" r="4" style="fill:var(--border-3,#cbd5e1)"/><text x="82" y="106" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:22px;font-weight:700;white-space:pre">cost-audit.md</text><rect x="489.6" y="89" width="74.4" height="23" rx="11.5" style="fill:var(--bf-s1,#b45309);fill-opacity:0.13;stroke:var(--bf-s1,#b45309);stroke-width:1.2"/><text x="526.8" y="106" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:600;white-space:pre">monthly</text><line x1="24" y1="117" x2="576" y2="117" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="40" y="139" text-anchor="start" style="fill:var(--bf-s1,#b45309);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;font-weight:700;white-space:pre">## 1. Measure</text><text x="40" y="162" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">[ ] Log input and output tokens per call</text><text x="40" y="185" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">[ ] Split input: prompt, history, docs, retrieval</text><text x="40" y="208" text-anchor="start" style="fill:var(--bf-s1,#b45309);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;font-weight:700;white-space:pre">## 2. Fix the top three</text><text x="40" y="231" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">[ ] Biggest part first, one change at a time</text><text x="40" y="254" text-anchor="start" style="fill:var(--bf-s1,#b45309);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;font-weight:700;white-space:pre">## 3. Prove it</text><text x="40" y="277" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">[ ] Re-run a fixed set of real questions</text><text x="40" y="300" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">[ ] Keep only changes that hold quality</text><line x1="24" y1="327" x2="576" y2="327" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="336" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="337.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect