<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 431" width="600" height="431" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">One 500-word page, three ways</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Worked example: input tokens when an AI app reads the page. PDF</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">readers often send the extracted text plus an image of every page.</text><rect x="24" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s1,#b45309)"/><text x="44" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">Page text</text><rect x="136.4" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s2,#6d5fd0)"/><text x="156.4" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">Page image</text><text x="24" y="151" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Markdown</text><path d="M24 159H102Q106 159 106 163V179Q106 183 102 183H24Z" style="fill:var(--bf-s1,#b45309)"><title>Markdown, text: 667</title></path><line x1="24" y1="157" x2="24" y2="185" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="114" y="17