chor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">ACME Corp | Annual Report 2025</text><line x1="38" y1="155" x2="303" y2="155" style="stroke:var(--bf-s3,#c2558f);stroke-width:1.5;stroke-linecap:round"/><text x="40" y="183" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">Revenue grew 18% in the fiscal year.</text><text x="40" y="206" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">Page 12 | Confidential</text><line x1="38" y1="201" x2="233.4" y2="201" style="stroke:var(--bf-s3,#c2558f);stroke-width:1.5;stroke-linecap:round"/><text x="40" y="229" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">ACME Corp | Annual Report 2025</text><line x1="38" y1="224" x2="303" y2="224" style="stroke:var(--bf-s3,#c2558f);stroke-width:1.5;stroke-linecap:round"/><text x="40" y="252" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">Operating costs fell 4%.</text><text x="40" y="275" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">Page 13 | Confidential</text><line x1="38" y1="270" x2="233.4" y2="270" style="stroke:var(--bf-s3,#c2558f);stroke-width:1.5;stroke-linecap:round"/><text x="40" y="298" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">ACME Corp | Annual Report 2025</text><line x1="38" y1="293" x2="303" y2="293" style="stroke:var(--bf-s3,#c2558f);stroke-width:1.5;stroke-linecap:round"/><text x="40" y="321" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">Headcount rose to 240.</text><text x="40" y="344" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14.5px;white-space:pre">Page 14 | Confidential</text><line x1="38" y1="339" x2="233.4" y2="339" style="stroke:var(--bf-s3,#c2558f);stroke-width:1.5;stroke-linecap:round"/><text x="24" y="397" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">On a 60-page report that is 120 lines of noise. Each is small, and they</text><text x="24" y="416" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">are sent with every question.</text><line x1="24" y1="427" x2="576" y2="427" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="436" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="437.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="438.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="439.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="441" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="442.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="443.5" width="1.3" heigh