<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 433" width="600" height="433" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Before the text goes in a prompt</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Six quick confirmations against the original scan.</text><rect x="24" y="83" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 93.5L33 98L40 88" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="98" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Every page has text, or a stated reason it has none</text><rect x="24" y="121" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 131.5L33 136L40 126" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="136" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Recognized page labels appear in the right order</text><rect x="24" y="159" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 169.5L33 174L40 164" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="174" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Amounts add up</text><text x="58" y="195" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Subtotal plus tax equals the total.</text><rect x="24" y="214" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 224.5L33 229L40 219" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="229" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">IDs and dates match the original exactly</text><text x="58" y="250" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Watch O and 0, S and 5, and day/month order.</text><rect x="24" y="269" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 279.5L33 284L40 274" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="284" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Every table column survived</text><rect x="24" y="307" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 317.5L33 322L40 312" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="322" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Unreadable fields are flagged, not guessed</text><text x="24" y="367" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Recognition is set up for English printed text. Read other languages and</text><text x="24" y="386" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">handwriting in full.</text><line x1="24" y1="397" x2="576" y2="397" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="406" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="407.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="408.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="409.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="411" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="412.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="413.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="406" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="407.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="408.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="409.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="411" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="412.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="413.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="416" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="415" text-anchor="end" style="fill:var(--faint,#64748b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser · llmiser.devbehindyou.com</text></svg>
