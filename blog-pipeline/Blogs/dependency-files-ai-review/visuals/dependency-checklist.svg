<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 342" width="600" height="342" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Before you zip</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Dependency files in a sharing copy.</text><rect x="24" y="83" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 93.5L33 98L40 88" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="98" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Manifest kept (package.json, pyproject.toml)</text><rect x="24" y="121" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 131.5L33 136L40 126" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="136" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Lockfile kept</text><rect x="24" y="159" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 169.5L33 174L40 164" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="174" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-