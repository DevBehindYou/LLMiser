<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" width="600" height="376" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Check the file, not the reader</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Open what you exported before you use it.</text><rect x="24" y="83" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 93.5L33 98L40 88" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="98" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Your last edit is in the file</text><rect x="24" y="121" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 131.5L33 136L40 126" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="136" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">The last line matches the reader</text><text x="58" y="157" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Long documents may pause the preview, never the export.</text><rect x="24" y="176" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 186.5L33 191L40 181" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="191" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Every document in a ZIP is there</text><text x="58" y="212" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Check names with a (2) suffix.</text><rect x="24" y="231" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 241.5L33 246L40 236" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="246" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Tables and headings render where you pasted</text><rect x="24" y="269" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 279.5L33 284L40 274" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="284" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Comments and markers are kept or removed on purpose</text><text x="24" y="329" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Close the tab without exporting and your edits are gone.</text><line x1="24" y1="340" x2="576" y2="340" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="349" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="350.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="351.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="352.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="354" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="355.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="356.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="349" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="350.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="351.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="352.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="354" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="355.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="356.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="359" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="358" text-anchor="end" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser · llmiser.devbehindyou.com</text></svg>
