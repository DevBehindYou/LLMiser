<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" width="600" height="385" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Trace each gap to its cause</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">What happened in the packet, and what fixed it.</text><rect x="24" y="81" width="269" height="124" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="93" width="4" height="100" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="42" y="117" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">5</text><text x="74.5" y="110" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Scan with a stamp</text><text x="42" y="147" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Read as a text page, so only the</text><text x="42" y="165" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">stamp came back. Fix: export as</text><text x="42" y="183" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">an image.</text><rect x="307" y="81" width="269" height="124" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="93" width="4" height="100" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="325" y="117" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">6</text><text x="357.5" y="110" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Small photo</text><text x="325" y="147" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">About 19% picture, under 30%, so</text><text x="325" y="165" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">not read. Fix: export as an</text><text x="325" y="183" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">image.</text><rect x="24" y="219" width="269" height="124" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="231" width="4" height="100" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="42" y="255" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">7</text><text x="74.5" y="248" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Hidden copy</text><text x="42" y="285" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">The approval came back twice.</text><text x="42" y="303" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Fix: compare, then delete the</text><text x="42" y="321" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">repeat.</text><rect x="307" y="219" width="269" height="124" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="231" width="4" height="100" rx="2" style="fill:var(--bf-s1,#b45309)"/><text x="325" y="255" text-anchor="start" style="fill:var(--bf-s1,#b45309);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">3 8</text><text x="390.5" y="248" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Blank pages</text><text x="325" y="285" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">No trace here, a notice in</text><text x="325" y="303" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">another file. Fix: note them.</text><line x1="24" y1="349" x2="576" y2="349" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="358" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="359.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="360.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="361.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="363" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="364.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="365.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="358" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="359.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="360.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="361.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="363" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="364.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="365.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="368" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="367" text-anchor="end" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser · llmiser.devbehindyou.com</text></svg>
