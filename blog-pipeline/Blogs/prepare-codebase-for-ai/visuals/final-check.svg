<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 393" width="600" height="393" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Before you send the copy</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">A last pass on the sharing copy, then on the converted output.</text><rect x="24" y="83" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 93.5L33 98L40 88" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="98" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Run the tests inside the copy</text><text x="58" y="119" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">They pass, or fail for the reason you are asking about.</text><rect x="24" y="138" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 148.5L33 153L40 143" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="153" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Search for key, token, password, secret and @</text><rect x="24" y="176" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 186.5L33 191L40 181" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="191" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Keep one version of each file</text><text x="58" y="212" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">No _old, (copy) or backup ZIPs.</text><rect x="24" y="231" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 241.5L33 246L40 236" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="246" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Read the skipped list after conversion</text><text x="58" y="267" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Source the task needs should never be on it.</text><rect x="24" y="286" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 296.5L33 301L40 291" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="301" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Stay under 15 MB and 2,000 files</text><text x="24" y="346" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Name rules and searches can miss a secret. Rotate any that leaked.</text><line x1="24" y1="357" x2="576" y2="357" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="366" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="367.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="368.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="369.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="371" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="372.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="373.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="366" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="367.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="368.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="369.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="371" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="372.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="373.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="376" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="375" text-anchor="end" style="fill:var(--faint,#64748b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser · llmiser.devbehindyou.com</text></svg>
