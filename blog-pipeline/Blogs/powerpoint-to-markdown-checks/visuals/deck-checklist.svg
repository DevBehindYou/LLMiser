<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 435" width="600" height="435" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Before you share the Markdown</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">With the original deck open beside it.</text><rect x="24" y="83" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 93.5L33 98L40 88" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="98" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">No hidden or backup slides</text><text x="58" y="119" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Hidden slides convert without a mark.</text><rect x="24" y="138" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 148.5L33 153L40 143" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="153" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Every slide has a unique title</text><rect x="24" y="176" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 186.5L33 191L40 181" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="191" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Sub-points still make sense without indents</text><rect x="24" y="214" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 224.5L33 229L40 219" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="229" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Speaker notes are edited for sharing</text><rect x="24" y="252" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 262.5L33 267L40 257" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="267" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Chart units and takeaways are written as text</text><rect x="24" y="290" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 300.5L33 305L40 295" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="305" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Image-only slides are described</text><rect x="24" y="328" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 338.5L33 343L40 333" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="343" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Table units sit in the headers</text><text x="24" y="388" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Pictures in slides are not read as text.</text><line x1="24" y1="399" x2="576" y2="399" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="408" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="409.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="410.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="411.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="413" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="414.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="415.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="408" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="409.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="410.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="411.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="413" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="414.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="415.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="418" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="417" text-anchor="end" style="fill:var(--faint,#64748b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser · llmiser.devbehindyou.com</text></svg>
