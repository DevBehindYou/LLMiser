<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 354" width="600" height="354" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">How orientation is handled</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">From LLMiser recognition code. Quarter turns only.</text><line x1="289" y1="121" x2="310" y2="121" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M302.8 124.5L310 121L302.8 117.5" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><line x1="445.5" y1="165" x2="445.5" y2="190" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M442 182.8L445.5 190L449 182.8" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><line x1="311" y1="235" x2="290" y2="235" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M297.2 231.5L290 235L297.2 238.5" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><rect x="24" y="81" width="261" height="80" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><text x="32" y="95" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">01</text><text x="154.5" y="124" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Camera tag</text><text x="154.5" y="143" text-anchor="middle" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">applied first</text><rect x="315" y="81" width="261" height="80" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><text x="323" y="95" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">02</text><text x="445.5" y="124" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Read the page</text><text x="445.5" y="143" text-anchor="middle" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">measure confidence</text><rect x="315" y="195" width="261" height="80" rx="10" style="fill:var(--bf-s2,#6d5fd0);fill-opacity:0.12;stroke:var(--bf-s2,#6d5fd0);stroke-width:2"/><text x="323" y="209" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">03</text><text x="445.5" y="238" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Weak read?</text><text x="445.5" y="257" text-anchor="middle" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">then check turns</text><rect x="24" y="195" width="261" height="80" rx="10" style="fill:var(--bf-s1,#b45309);fill-opacity:0.12;stroke:var(--bf-s1,#b45309);stroke-width:2"/><text x="32" y="209" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">04</text><text x="154.5" y="238" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Keep the best</text><text x="154.5" y="257" text-anchor="middle" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">only if clearly better</text><text x="24" y="307" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">A tilt of a few degrees is not a quarter turn, so it is read as it is.</text><line x1="24" y1="318" x2="576" y2="318" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="327" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="328.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="329.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="330.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="332" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="333.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="334.5" width="1.3" height="1.3" style="fill:#f59