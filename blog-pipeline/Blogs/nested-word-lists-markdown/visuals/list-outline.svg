<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 575" width="600" height="575" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Outline the lists first</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">The original procedure as a word processor showed it.</text><rect x="24" y="81" width="552" height="415" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><text x="62" y="113" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">Return your equipment</text><text x="562" y="113" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">HEADING</text><text x="62" y="136" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">1. Pack the device</text><text x="80" y="159" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">a. Remove the SIM card</text><text x="80" y="182" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">b. Wipe personal files</text><text x="98" y="205" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">- Photos</text><text x="98" y="228" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">- Downloads</text><text x="62" y="251" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">2. Print the return label</text><text x="62" y="274" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">Note: labels expire...</text><text x="562" y="274" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">NOT A LIST ITEM</text><text x="62" y="297" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">3. Drop off the parcel</text><text x="562" y="297" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">CONTINUES</text><text x="62" y="320" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">After drop-off</text><text x="562" y="320" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">HEADING</text><text x="62" y="343" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">1. Check the email</text><text x="562" y="343" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">RESTARTS</text><text x="62" y="366" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">2. Keep the receipt</text><text x="62" y="389" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">Items we can't take back</text><text x="562" y="389" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">HEADING</text><text x="62" y="412" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">1. Final-sale items</text><text x="562" y="412" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">LIST NUMBER</text><text x="80" y="435" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">- Clearance labels</text><text x="562" y="435" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">LIST BULLET 2</text><text x="80" y="458" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">- Opened bundles</text><text x="562" y="458" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">LIST BULLET 2</text><text x="62" y="481" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;white-space:pre">2. Gift cards</text><text x="562" y="481" text-anchor="end" style="fill:var(--muted,#52525b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;white-space:pre">LIST NUMBER</text><text x="24" y="528" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Numbering as LibreOffice displayed the original file.</text><line x1="24" y1="539" x2="576" y2="539" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="548" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="549.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="550.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="551.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="553" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="554.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="555.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="548" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="549.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="550.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="551.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="553" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="554.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="555.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="558" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="557" text-anchor="end" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;white-space:pre">LLMiser 