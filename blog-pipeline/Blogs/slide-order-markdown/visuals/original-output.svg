<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 538" width="600" height="538" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Where the text landed</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Converted original, slides 3 to 6.</text><rect x="24" y="81" width="552" height="372" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><text x="40" y="107" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">&lt;!-- Slide number: 3 --&gt;</text><path d="M40 129L46 119L52 129Z" style="fill:var(--bf-s3,#c2558f);stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="129" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre">Step 1 of 3</text><text x="562" y="129" text-anchor="end" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-style:italic;white-space:pre">above its heading</text><text x="40" y="151" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre"># Symptoms</text><text x="40" y="173" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">Users see error 4012 after entering a password.</text><text x="40" y="195" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">&lt;!-- Slide number: 4 --&gt;</text><path d="M40 217L46 207L52 217Z" style="fill:var(--bf-s3,#c2558f);stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="217" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre"># Symptoms</text><text x="562" y="217" text-anchor="end" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-style:italic;white-space:pre">repeated heading</text><text x="40" y="239" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">It happens only on the mobile app.</text><text x="40" y="261" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">&lt;!-- Slide number: 5 --&gt;</text><path d="M40 283L46 273L52 283Z" style="fill:var(--bf-s3,#c2558f);stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="283" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre">Step 2 of 3</text><text x="562" y="283" text-anchor="end" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-style:italic;white-space:pre">above its heading</text><text x="40" y="305" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre"># Cause</text><text x="40" y="327" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">The session token expires before the second request.</text><text x="40" y="349" text-anchor="start" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">&lt;!-- Slide number: 6 --&gt;</text><path d="M40 371L46 361L52 371Z" style="fill:var(--bf-s3,#c2558f);stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="371" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre">Step 3 of 3</text><text x="562" y="371" text-anchor="end" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-style:italic;white-space:pre">no heading on slide 6</text><path d="M40 393L46 383L52 393Z" style="fill:var(--bf-s3,#c2558f);stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="393" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre">Fix</text><text x="40" y="415" text-anchor="start" style="fill:var(--text,#18181b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">Refresh the token before the second request.</text><path d="M40 437L46 427L52 437Z" style="fill:var(--bf-s3,#c2558f);stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="437" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;white-space:pre">As the previous slide shows, timing is the cause.</text><text x="562" y="437" text-anchor="end" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-style:italic;white-space:pre">points back</text><text x="24" y="491" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Two body lines omitted. Local run, 9 November 2026.</text><line x1="24" y1="502" x2="576" y2="502" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="511" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="512.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="513.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="514.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="516" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="