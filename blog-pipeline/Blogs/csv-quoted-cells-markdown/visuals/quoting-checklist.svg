<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 418" width="600" height="418" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Quoting pass</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Before you convert a CSV file.</text><rect x="24" y="83" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 93.5L33 98L40 88" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="98" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">File read in a plain text editor</text><rect x="24" y="121" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 131.5L33 136L40 126" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="136" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Quote is the first character of each quoted field</text><rect x="24" y="159" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 169.5L33 174L40 164" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="174" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Quotes inside a cell are doubled</text><rect x="24" y="197" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 207.5L33 212L40 202" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="212" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Every opening quote is closed</text><rect x="24" y="235" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 245.5L33 250L40 240" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="250" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Converted header has no empty last column</text><rect x="24" y="273" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 283.5L33 288L40 278" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="288" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Data row count matches the source</text><rect x="24" y="311" width="20" height="20" rx="4" style="fill:var(--surface-2,#f5f3ee);stroke:var(--bf-s1,#b45309);stroke-width:2"/><path d="M28.5 321.5L33 326L40 316" style="fill:none;stroke:var(--bf-s1,#b45309);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/><text x="58" y="326" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15.5px;font-weight:600;white-space:pre">Line breaks in cells replaced where they matter</text><text x="24" y="371" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Comma-separated files only. One synthetic table.</text><line x1="24" y1="382" x2="576" y2="382" style="stroke:var(--border,#e2e8f0);stroke-width:1;stroke-linecap:round"/><rect x="330.1" y="391" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="392.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="393.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="333.9" y="394.8" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="332.6" y="396" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="331.4" y="397.3" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="330.1" y="398.5" width="1.3" height="1.3" style="fill:#f59e0b"/><rect x="338.9" y="391" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="392.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="393.5" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="394.8" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="396" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="397.3" width="1.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="398.5" width="6.3" height="1.3" style="fill:var(--text,#18181b)"/><rect x="338.9" y="401" width="6.3" height="1.3" style="fill:#a0a0ff"/><text x="576" y="400" text-anchor="end" style="fill:var(--faint,#64748b);font-feature-settings:'calt' 0,'liga' 0;font-family:var(--font-jetbrains-mono,'JetB